version: '3.8'

services:
  redis-broker:
    image: redis:7-alpine
    container_name: rtpsc-redis
    ports:
      - "6379:6379"
    restart: always

  api-server:
    build: .
    container_name: rtpsc-api-server
    command: uvicorn api_server:app --host 0.0.0.0 --port 8000 --workers 4
    ports:
      - "8000:8000"
    depends_on:
      - redis-broker
    restart: on-failure

  celery-worker:
    build: .
    container_name: rtpsc-celery-worker
    command: celery -A celery_worker worker --loglevel=info
    depends_on:
      - redis-broker
      - api-server
    restart: always

  frontend:
    image: node:18-alpine
    container_name: rtpsc-frontend
    working_dir: /app
    volumes:
      - .:/app
    command: npm start
    ports:
      - "3000:3000"
