version: "3.9"

services:
  redis-broker:
    image: redis:8.0.0-alpine
    container_name: rtpsc-redis
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --protected-mode
      - "yes"
    restart: unless-stopped
    networks:
      - rtpsc-internal

  api-server:
    build:
      context: .
    container_name: rtpsc-api-server
    command: uvicorn api_server:app --host 0.0.0.0 --port 8000 --workers 2
    environment:
      SUPABASE_URL: ${SUPABASE_URL:?required}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:?required}
      REDIS_URL: redis://redis-broker:6379/0
      ACK_ADAPTER_ENABLED: ${ACK_ADAPTER_ENABLED:-false}
      ACK_ADAPTER_TOKEN: ${ACK_ADAPTER_TOKEN:-}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - redis-broker
    restart: on-failure
    networks:
      - rtpsc-internal

  celery-worker:
    build:
      context: .
    container_name: rtpsc-celery-worker
    command: celery -A celery_worker.celery_app worker --loglevel=info
    environment:
      SUPABASE_URL: ${SUPABASE_URL:?required}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:?required}
      REDIS_URL: redis://redis-broker:6379/0
    depends_on:
      - redis-broker
      - api-server
    restart: unless-stopped
    networks:
      - rtpsc-internal

networks:
  rtpsc-internal:
    driver: bridge
    internal: true
